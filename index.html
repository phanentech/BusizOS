      <Btn kind="primary" busy={busy === 'save'} onClick={() => save()}>Save</Btn></div>
    <div className="card"><div className="card-h"><h3>Providers &amp; API keys</h3><span className="tiny muted">{d.providers.filter((p) => p.hasKey).length} of {d.providers.length} connected</span></div><div className="card-b grid g3" style={{ gap: 10 }}>{d.providers.map((p) => <div key={p.id} className={'provcard' + (p.hasKey ? ' on' : '')}>
      <div className="row between"><b className="ellip">{p.label}</b>{p.free && <Badge tone="green">free tier</Badge>}</div>
      <div className="tiny muted" style={{ margin: '2px 0 8px' }}>{p.models} model{p.models === 1 ? '' : 's'} · {p.hasKey ? <span style={{ color: 'var(--ok)' }}>key {p.keyHint}</span> : 'no key'}</div>
      <div className="row" style={{ gap: 4 }}><Btn size="sm" onClick={() => setKeyFor(p)}>{p.hasKey ? 'Replace key' : 'Add key'}</Btn>{p.site && <a className="btn ghost sm" href={p.site} target="_blank" rel="noopener">Get a key<Icon n="ext" s={12} /></a>}</div></div>)}
      <button className="provcard add" onClick={() => setAdd({ type: 'provider', label: '', url: '' })}><Icon n="plus" />Add an OpenAI-compatible provider</button></div></div>
    <div className="card"><div className="card-h"><h3>Models ({d.models.length})</h3><div className="row" style={{ gap: 6 }}><Btn size="sm" icon="plus" onClick={() => setAdd({ type: 'model', provider: d.providers.find((p) => p.hasKey)?.id || 'openrouter', model: '', label: '', tier: 'standard' })}>Custom model</Btn></div></div>
      <div className="row wrap" style={{ padding: '10px 16px', gap: 8, borderBottom: '1px solid var(--border2)' }}><input value={q} onChange={(e) => setQ(e.target.value)} placeholder="Search models" style={{ maxWidth: 220 }} aria-label="Search models" /><select value={prov} onChange={(e) => setProv(e.target.value)} style={{ width: 'auto' }} aria-label="Provider"><option value="">All providers</option>{d.providers.map((p) => <option key={p.id} value={p.id}>{p.label}</option>)}</select><span className="tiny muted">Model IDs change as providers release new versions — edit the ID to match your provider's docs, then press Test.</span></div>
      <div className="tscroll"><table className="tbl"><thead><tr><th style={{ width: 54 }}>On</th><th>Model</th><th>API model ID</th><th>Tier</th><th>Plans</th><th style={{ textAlign: 'right' }} className="hide-m">30-day use</th><th /></tr></thead><tbody>{shown.map((m) => { const c = cur(m), t = test[m.key]; return <tr key={m.key} style={{ opacity: c.enabled ? 1 : 0.6 }}>
        <td><Switch on={c.enabled} onChange={(x) => setM(m, { enabled: x })} label={'Offer ' + c.label} /></td>
        <td style={{ minWidth: 180 }}><input value={c.label} onChange={(e) => setM(m, { label: e.target.value })} aria-label="Display name" style={{ fontWeight: 600 }} /><div className="tiny muted" style={{ marginTop: 3 }}>{m.providerLabel}{m.free ? ' · free tier' : ''}{!m.ready && <span style={{ color: 'var(--warn)' }}> · needs key</span>}{d.businessesUsing[m.key] ? ' · ' + d.businessesUsing[m.key] + ' business' + (d.businessesUsing[m.key] > 1 ? 'es' : '') : ''}</div></td>
        <td style={{ minWidth: 170 }}><input value={c.model} onChange={(e) => setM(m, { model: e.target.value })} aria-label="API model ID" style={{ fontFamily: 'ui-monospace,monospace', fontSize: 12.5 }} /></td>
        <td><select value={c.tier} onChange={(e) => setM(m, { tier: e.target.value })} style={{ width: 'auto' }} aria-label="Tier">{Object.keys(d.tiers).map((k) => <option key={k} value={k}>{d.tiers[k]}</option>)}</select></td>
        <td style={{ minWidth: 150 }}><PlanPicker plans={plans} value={c.plans} onChange={(p) => setM(m, { plans: p })} /></td>
        <td style={{ textAlign: 'right' }} className="hide-m small">{m.usage30.requests ? m.usage30.requests.toLocaleString() + ' req' : '—'}<div className="tiny muted">{m.usage30.requests ? Math.round((m.usage30.inputTokens + m.usage30.outputTokens) / 1000).toLocaleString() + 'k tokens' : ''}</div></td>
        <td style={{ whiteSpace: 'nowrap' }}><Btn size="sm" disabled={!m.ready || (t && t.busy) || dirty} busy={t && t.busy} onClick={() => runTest(m)} title={dirty ? 'Save changes first' : m.ready ? 'Send a tiny test prompt' : 'Add a key first'}>Test</Btn>{!m.builtIn && <Btn size="sm" kind="ghost" icon="trash" aria-label={'Remove ' + c.label} onClick={() => setV({ ...v, extra: v.extra.filter((x) => x.key !== m.key) })} />}{t && !t.busy && <div className="tiny" style={{ color: t.ok ? 'var(--ok)' : 'var(--bad)', maxWidth: 200, whiteSpace: 'normal' }}>{t.text}</div>}</td></tr>; })}</tbody></table></div>
      <div className="row" style={{ padding: '12px 16px', gap: 8 }}><div className="grow small muted">{dirty ? 'You have unsaved changes.' : ready.length + ' model' + (ready.length === 1 ? ' is' : 's are') + ' switched on with a key.'}</div><Btn disabled={!dirty} onClick={() => load(d)}>Discard</Btn><Btn kind="primary" disabled={!dirty} busy={busy === 'save'} onClick={() => save()}>Save models</Btn></div></div>
    {keyFor && <AiKeyModal p={keyFor} onClose={() => setKeyFor(null)} onSaved={() => { setKeyFor(null); reload(); }} />}
    {add && add.type === 'provider' && <Modal title="Add an OpenAI-compatible provider" onClose={() => setAdd(null)} footer={<><Btn onClick={() => setAdd(null)}>Cancel</Btn><Btn kind="primary" disabled={!add.label.trim() || !/^https:\/\//.test(add.url)} onClick={() => { save({ customProviders: [...v.customProviders, { label: add.label, url: add.url }] }, 'Provider added — now add its key'); setAdd(null); }}>Add provider</Btn></>}><p className="small muted" style={{ marginTop: 0 }}>Most AI providers offer an OpenAI-compatible API (for example Fireworks, Perplexity, NVIDIA, Hugging Face, or a model you host yourself).</p><Field label="Name"><input value={add.label} onChange={(e) => setAdd({ ...add, label: e.target.value })} placeholder="e.g. Fireworks AI" autoFocus /></Field><Field label="Base URL" hint="Ends in /v1 for most providers. /chat/completions is added for you."><input value={add.url} onChange={(e) => setAdd({ ...add, url: e.target.value })} placeholder="https://api.fireworks.ai/inference/v1" /></Field></Modal>}
    {add && add.type === 'model' && <Modal title="Add a custom model" onClose={() => setAdd(null)} footer={<><Btn onClick={() => setAdd(null)}>Cancel</Btn><Btn kind="primary" disabled={!add.model.trim()} onClick={() => { save({ extra: [...v.extra, { provider: add.provider, model: add.model.trim(), label: add.label.trim() || add.model.trim(), tier: add.tier, enabled: true, plans: [] }] }, 'Model added'); setAdd(null); }}>Add model</Btn></>}><Field label="Provider"><select value={add.provider} onChange={(e) => setAdd({ ...add, provider: e.target.value })}>{d.providers.map((p) => <option key={p.id} value={p.id}>{p.label}{p.hasKey ? '' : ' (no key yet)'}</option>)}</select></Field><Field label="API model ID" hint="Exactly as the provider's docs write it, e.g. meta-llama/llama-4-maverick on OpenRouter"><input value={add.model} onChange={(e) => setAdd({ ...add, model: e.target.value })} autoFocus style={{ fontFamily: 'ui-monospace,monospace' }} /></Field><div className="grid g2" style={{ gap: 10 }}><Field label="Display name"><input value={add.label} onChange={(e) => setAdd({ ...add, label: e.target.value })} placeholder="Shown to businesses" /></Field><Field label="Tier"><select value={add.tier} onChange={(e) => setAdd({ ...add, tier: e.target.value })}>{Object.keys(d.tiers).map((k) => <option key={k} value={k}>{d.tiers[k]}</option>)}</select></Field></div><div className="tiny muted">The assistant and agents look up business data with tool calls, so choose a model that supports function/tool calling.</div></Modal>}
  </div>;
}
function PlanPicker({ plans, value, onChange }) {
  const [open, setOpen] = useState(false); const all = !value.length;
  return <div style={{ position: 'relative' }}><button type="button" className="btn sm" onClick={() => setOpen(!open)} aria-expanded={open}>{all ? 'All plans' : value.map((k) => (plans.find((p) => p.key === k) || {}).name || k).join(', ')}<Icon n="arrow" s={11} style={{ transform: 'rotate(90deg)' }} /></button>
    {open && <div className="pop" style={{ top: 34, left: 0, right: 'auto', width: 200, padding: 8 }} onMouseLeave={() => setOpen(false)}><label className="row small" style={{ gap: 6, padding: 4 }}><input type="checkbox" checked={all} onChange={() => onChange([])} />All plans</label>{plans.map((p) => <label key={p.key} className="row small" style={{ gap: 6, padding: 4 }}><input type="checkbox" checked={value.includes(p.key)} onChange={(e) => onChange(e.target.checked ? [...value, p.key] : value.filter((k) => k !== p.key))} />{p.name}</label>)}</div>}</div>;
}
function AiKeyModal({ p, onClose, onSaved }) {
  const { toast } = useApp(); const [k, setK] = useState(''); const [url, setUrl] = useState(''); const [busy, setBusy] = useState('');
  const go = async (remove) => { setBusy(remove ? 'rm' : 'save'); try { await api('admin.saveAiKey', { provider: p.id, key: remove ? '' : k.trim(), baseUrl: p.id === 'compatible' ? url : undefined }); toast(remove ? 'Key removed' : 'Key saved for ' + p.label); onSaved(); } catch (e) { toast(e.message, true); } finally { setBusy(''); } };
  return <Modal title={(p.hasKey ? 'Replace' : 'Add') + ' API key: ' + p.label} onClose={onClose} footer={<>{p.hasKey && <Btn className="btn danger" busy={busy === 'rm'} onClick={() => go(true)}>Remove key</Btn>}<div className="grow" /><Btn onClick={onClose}>Cancel</Btn><Btn kind="primary" busy={busy === 'save'} disabled={k.trim().length < 12} onClick={() => go(false)}>Save key</Btn></>}>
    <p className="small muted" style={{ marginTop: 0 }}>Stored as the Script Property <code>{p.keyName}</code>. It's never shown again — only its last four characters.{p.site ? <> Create one at <a href={p.site} target="_blank" rel="noopener">{p.site.replace('https://', '')}</a>.</> : null}</p>
    {p.id === 'compatible' && <Field label="Base URL" hint="e.g. https://api.fireworks.ai/inference/v1"><input value={url} onChange={(e) => setUrl(e.target.value)} placeholder="https://" /></Field>}
    <Field label="API key"><input type="password" autoComplete="off" value={k} onChange={(e) => setK(e.target.value)} placeholder={p.hasKey ? 'Paste a new key to replace ' + p.keyHint : 'Paste the key'} autoFocus /></Field>
    {p.free && <div className="tiny muted">Free tiers usually allow the provider to use prompts to improve their models and have low daily limits — good for trying things out.</div>}
  </Modal>;
}
function AiModelCard() {
  const { session, toast } = useApp(); const can = session.can;
  const [st, reload] = useLoad(() => api('ai.models'), []); const [busy, setBusy] = useState(''); const [tier, setTier] = useState('');
  if (st.loading && !st.data) return <div className="card card-b"><Skel h={80} /></div>; if (st.error) return <ErrorBox error={st.error} retry={reload} />;
  const d = st.data, pick = async (key) => { setBusy(key || 'default'); try { await api('ai.setModel', { model: key }); toast(key ? 'Model changed' : 'Using the platform default'); reload(); try { AI_STATUS = await api('ai.status'); } catch (e) {} } catch (e) { toast(e.message, true); } finally { setBusy(''); } };
  const canPick = d.allowChoice && can['ai.manage'];
  const groups = {}; d.models.filter((m) => !tier || m.tier === tier).forEach((m) => { (groups[m.providerLabel] = groups[m.providerLabel] || []).push(m); });
  return <div className="card"><div className="card-h"><h3>AI model</h3><span className="small">{d.using ? <>Using <b>{d.using.label}</b> <span className="muted">· {d.using.providerLabel}</span></> : <Badge tone="amber">Offline mode</Badge>}</span></div><div className="card-b">
    {!d.models.length ? <div className="small muted">No AI models are available yet. The platform admin can switch them on under Super admin → AI models.</div> : !canPick ? <div className="small muted">{d.allowChoice ? 'Ask an admin to change the model.' : 'The platform admin chooses the AI model for every business.'}</div> : <>
      <div className="row wrap" style={{ marginBottom: 10, gap: 8 }}><div className="seg">{[['', 'All'], ['premium', 'Premium'], ['standard', 'Standard'], ['fast', 'Fast']].map(([k, l]) => <button key={k} className={tier === k ? 'on' : ''} onClick={() => setTier(k)}>{l}</button>)}</div><span className="tiny muted">{d.models.length} models · plan: {d.plan}</span></div>
      <label className={'mpick' + (!d.current ? ' on' : '')}><input type="radio" name="aimodel" checked={!d.current} onChange={() => pick('')} disabled={!!busy} /><div className="grow"><div className="b small">Platform default{d.platformDefault ? ': ' + d.platformDefault.label : ''}</div><div className="tiny muted">Follows the platform admin's recommendation</div></div>{busy === 'default' && <span className="spin" />}</label>
      <div className="mgroups">{Object.keys(groups).map((g) => <div key={g}><div className="tiny b muted" style={{ margin: '10px 0 4px', textTransform: 'uppercase', letterSpacing: '.04em' }}>{g}</div>{groups[g].map((m) => <label key={m.key} className={'mpick' + (d.current === m.key ? ' on' : '') + (m.allowed ? '' : ' locked')}><input type="radio" name="aimodel" checked={d.current === m.key} disabled={!m.allowed || !!busy} onChange={() => pick(m.key)} /><div className="grow" style={{ minWidth: 0 }}><div className="row" style={{ gap: 6 }}><span className="b small ellip">{m.label}</span><Badge tone={TIER_TONE[m.tier]}>{d.tiers[m.tier]}</Badge>{m.free && <Badge>free tier</Badge>}</div>{m.note && <div className="tiny muted ellip">{m.note}</div>}</div>{!m.allowed ? <span className="tiny muted">Not in your plan</span> : busy === m.key ? <span className="spin" /> : null}</label>)}</div>)}</div></>}
  </div></div>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<Root />);
</script>
</body>
</html>
