<script>
  /* ─── BACKEND URL CONFIG ───────────────────────────────────
     Deployed inside Google Apps Script as a Web App: leave BACKEND_URL empty
     (the app talks to the server through google.script.run).
     Hosted somewhere else (Vercel, Netlify, GitHub Pages): paste your full
     Apps Script web app URL (ends in /exec) below, then upload this file.
         const BACKEND_URL = 'https://script.google.com/macros/s/XXXXXXXX/exec';
     No URL here? The app asks for it on first open and remembers it in this
     browser. You can also open  yoursite.com/?backend=<URL>  once to set it.
     Only the public web-app URL goes here. Never put API keys in this file. */
  const BACKEND_URL = '';   // ← paste your GAS /exec URL here (leave empty when deployed in GAS)

  const __lsGet = (k) => { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } };
  const __okUrl = (u) => /^https:\/\/script\.google(usercontent)?\.com\/.+/.test(String(u || '').trim());
  (function () {
    var q = ''; try { q = new URLSearchParams(location.search).get('backend') || ''; } catch (e) {}
    if (q && __okUrl(q)) { try { localStorage.setItem('bos_backend', q.trim()); } catch (e) {} }
  })();
  window.APP_CONFIG = {
    WEBAPP_URL: (BACKEND_URL || (__okUrl(__lsGet('bos_backend')) ? __lsGet('bos_backend') : '')).trim(),
    APP_NAME: 'BusinessOS'
  };
  window.__BOOT__ = /*__BOOT__*/null;
</script>

const money = (n, c) => { const v = Number(n) || 0, s = SYM[c || 'NGN'] || (c + ' '); if (Math.abs(v) >= 1e9) return s + (v / 1e9).toFixed(1).replace('.0', '') + 'bn'; if (Math.abs(v) >= 1e6) return s + (v / 1e6).toFixed(1).replace('.0', '') + 'm'; return s + Math.round(v).toLocaleString(); };

const fmtDate = (iso, withTime) => { if (!iso) return '—'; const d = new Date(iso); if (isNaN(d)) return '—'; return d.toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: d.getFullYear() !== new Date().getFullYear() ? 'numeric' : undefined }) + (withTime ? ', ' + d.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' }) : ''); };
const rel = (iso) => { if (!iso) return '—'; const s = (Date.now() - new Date(iso).getTime()) / 1000, f = s < 0, a = Math.abs(s); const t = a < 60 ? 'just now' : a < 3600 ? Math.round(a / 60) + 'm' : a < 86400 ? Math.round(a / 3600) + 'h' : a < 86400 * 30 ? Math.round(a / 86400) + 'd' : fmtDate(iso); return a < 60 ? t : /\d$/.test(t) ? t : (f ? 'in ' + t : t + ' ago'); };

function useToasts() {

function useLoad(fn, deps) {
  const [st, set] = useState({ loading: true, data: null, error: null });
  const reload = useCallback(() => { set((s) => ({ ...s, loading: true, error: null })); return fn().then((d) => set({ loading: false, data: d, error: null })).catch((e) => set({ loading: false, data: null, error: e })); }, deps); // eslint-disable-line
  useEffect(() => { reload(); }, [reload]);
  return [st, reload, (d) => set((s) => ({ ...s, data: typeof d === 'function' ? d(s.data) : d }))];
}

function useForm(init) {

  return { v, setV, errs, setErrs, busy, bind, run };

/* =================== charts (hand-drawn SVG) =================== */
function ComboChart({ buckets, monthly, currency }) {
  const W = 720, H = 220, P = { l: 34, r: 56, t: 14, b: 26 };
  if (!buckets || !buckets.length) return null;
  const n = buckets.length, maxL = Math.max(1, ...buckets.map((b) => b.leads)), maxW = Math.max(1, ...buckets.map((b) => b.won));
  const iw = W - P.l - P.r, ih = H - P.t - P.b, bw = Math.max(2, (iw / n) * 0.62);
  const x = (i) => P.l + (iw / n) * (i + 0.5), yl = (v) => P.t + ih - (v / maxL) * ih, yw = (v) => P.t + ih - (v / maxW) * ih;
  const step = Math.max(1, Math.ceil(n / 8));
  const lab = (s) => monthly ? new Date(s + '-01T12:00:00').toLocaleDateString(undefined, { month: 'short' }) : new Date(s + 'T12:00:00').toLocaleDateString(undefined, { day: 'numeric', month: 'short' });
  let cum = 0; const cumPts = buckets.map((b, i) => { cum += b.won; return [x(i), cum]; }); const maxC = Math.max(1, cum);
  const yc = (v) => P.t + ih - (v / maxC) * ih;
  return <svg viewBox={`0 0 ${W} ${H}`} style={{ width: '100%', height: 'auto', display: 'block' }} role="img" aria-label="New leads per period with cumulative won value">
    {[0, 0.5, 1].map((f) => <g key={f}><line x1={P.l} x2={W - P.r} y1={P.t + ih * (1 - f)} y2={P.t + ih * (1 - f)} stroke="var(--border2)" /><text className="chart-t" x={P.l - 6} y={P.t + ih * (1 - f) + 4} textAnchor="end">{Math.round(maxL * f)}</text>{cum > 0 && <text className="chart-t" x={W - P.r + 6} y={P.t + ih * (1 - f) + 4}>{money(maxC * f, currency)}</text>}</g>)}
    {buckets.map((b, i) => <rect key={i} x={x(i) - bw / 2} y={yl(b.leads)} width={bw} height={Math.max(0, P.t + ih - yl(b.leads))} rx={Math.min(3, bw / 3)} fill="var(--accent)" opacity=".85"><title>{lab(b.label)}: {b.leads} leads, {moneyFull(b.won, currency)} won</title></rect>)}
    {cum > 0 && <polyline fill="none" stroke="var(--ok)" strokeWidth="2.2" points={cumPts.map((p) => p[0] + ',' + yc(p[1])).join(' ')} />}
    {buckets.map((b, i) => i % step === 0 ? <text key={i} className="chart-t" x={x(i)} y={H - 8} textAnchor="middle">{lab(b.label)}</text> : null)}
  </svg>;
}

/* =================== root =================== */
function Root() {
  const [toasts, toast] = useToasts();
  const [session, setSession] = useState(null);
  const [booting, setBooting] = useState(true);
  const [config, setConfig] = useState(null);
  const [userTheme, setUserTheme] = useState(() => store.get('bos_theme_u'));
  const [team, setTeam] = useState([]);
  const brand = (session && session.branding) || (config && config.branding) || null;
  if (brand) BRAND = { ...BRAND, ...brand };
  const sysDark = !!(window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
  const theme = userTheme || (BRAND.defaultTheme === 'dark' || BRAND.defaultTheme === 'light' ? BRAND.defaultTheme : sysDark ? 'dark' : 'light');
  const setTheme = (t) => { store.set('bos_theme_u', t); setUserTheme(t); };
  useEffect(() => { document.documentElement.setAttribute('data-theme', theme); }, [theme]);
  useEffect(() => { if (PUBLIC_VIEW) return; const own = BRAND.allowBusinessBranding !== false && session && session.business && session.business.brandColor; applyAccent(own || BRAND.primaryColor || '#2563eb'); document.title = BRAND.appName; }, [session, config]); // eslint-disable-line
  useEffect(() => { if (configured()) api('public.config').then(setConfig).catch(() => {}); }, []);
  onAuthLost = () => { setToken(''); setSession(null); };
  const refreshTeam = useCallback(() => api('team.list').then(setTeam).catch(() => setTeam([])), []);
  useEffect(() => { if (session && session.business && session.can['team.read']) refreshTeam(); }, [session && session.business && session.business.id]); // eslint-disable-line
  useEffect(() => {
    if (!configured() || PUBLIC_VIEW) { setBooting(false); return; }
    (async () => {
      if (PARAMS.verify) { try { await api('auth.verifyEmail', { token: PARAMS.verify }); toast('Email verified. Thank you!'); } catch (e) { toast(e.message, true); } }
      if (TOKEN && !PARAMS.reset && !PARAMS.invite) { try { setSession(await api('auth.me')); } catch (e) { if (e.code !== 'AUTH_REQUIRED') toast(e.message, true); } }
      setBooting(false);
    })();
  }, []); // eslint-disable-line
  const onSession = (s) => { if (s.token) setToken(s.token); setSession((cur) => ({ ...(cur || {}), ...s })); };
  const logout = async () => { try { await api('auth.logout'); } catch (e) {} setToken(''); setSession(null); };
  const value = { session, setSession: onSession, toast, theme, setTheme, logout, team, refreshTeam, config };
  let view;
  if (PARAMS.form) view = <PublicForm formId={PARAMS.form} />;
  else if (PUBLIC_VIEW && !configured()) view = <NotConfigured />;
  else if (PARAMS.track) view = <OrderTrackPage token={PARAMS.track} />;
  else if (PARAMS.book) view = <PublicBooking bkey={PARAMS.book} />;
  else if (PARAMS.appt) view = <ManageBooking token={PARAMS.appt} />;
  else if (PARAMS.portal) view = <PortalApp pkey={PARAMS.portal} />;
  else if (PARAMS.p) view = <PublicSitePage pageKey={PARAMS.p} />;
  else if (PARAMS.chat) view = <ChatWidget widgetKey={PARAMS.chat} />;
  else if (PARAMS.unsub) view = <Unsubscribe token={PARAMS.unsub} />;
  else if (PARAMS.doc) view = <PublicDoc token={PARAMS.doc} />;
  else if (PARAMS.pay) view = <PayReturn reference={PARAMS.pay} />;
  else if (PARAMS.mockpay) view = <MockCheckout reference={PARAMS.mockpay} />;
  else if (!configured()) view = <NotConfigured />;
  else if (booting) view = <div style={{ display: 'grid', placeItems: 'center', minHeight: '100vh' }}><span className="spin" style={{ width: 28, height: 28, color: 'var(--accent)' }} /></div>;
  else if (!session) view = <AuthScreen />;
  else if (session.needsOnboarding && !session.user.isSuperAdmin) view = <Onboarding />;
  else if (session.needsOnboarding && session.user.isSuperAdmin) view = <AdminOnly />;
  else view = <Shell />;
  return <Ctx.Provider value={value}>{view}<div className="toasts" aria-live="polite">{toasts.map((t) => <div key={t.id} className={'toast' + (t.bad ? ' bad' : '')}>{t.msg}</div>)}</div></Ctx.Provider>;
}

/* =================== auth =================== */
function AuthScreen() {
  const { setSession, toast, config: cfg } = useApp();
  const [mode, setMode] = useState(PARAMS.invite ? 'invite' : PARAMS.reset ? 'reset' : 'login');
  const [otp, setOtp] = useState(null);
  const f = useForm({ name: '', email: '', password: '', code: '' });
  const go = (m) => { f.setErrs({}); setMode(m); };
  const submit = (e) => {
    e && e.preventDefault();
    f.run(async () => {
      if (mode === 'login') { const r = await api('auth.login', { email: f.v.email, password: f.v.password }); if (r.twoFactorRequired) { setOtp(r); setMode('otp'); } else setSession(r); }
      else if (mode === 'otp') setSession(await api('auth.verifyOtp', { challenge: otp.challenge, code: f.v.code }));
      else if (mode === 'signup') setSession(await api('auth.signup', { name: f.v.name, email: f.v.email, password: f.v.password }));
      else if (mode === 'forgot') { const r = await api('auth.requestReset', { email: f.v.email }); toast(r.message); go('login'); }
      else if (mode === 'reset' || mode === 'invite') { const r = await api('auth.setPassword', { token: PARAMS.reset || PARAMS.invite, password: f.v.password, name: f.v.name || undefined }); try { history.replaceState(null, '', location.pathname); } catch (x) {} setSession(r); }
    }).catch((err) => { if (!err.field) toast(err.message, true); });

        <div className="journey hide-m">{['Capture lead', 'CRM', 'Follow up', 'Close sale', 'Invoice', 'Get paid', 'Retain'].map((s) => <span key={s}>{s}</span>)}</div></div>
      <div className="small hide-m" style={{ color: 'rgba(255,255,255,.7)' }}>{BRAND.footerText || BRAND.tagline || ''}</div></div>
    <div className="formside"><div className="box">
      <h1 style={{ fontSize: 24, margin: '0 0 4px' }}>{titles[mode][0]}</h1><p className="muted" style={{ marginTop: 0 }}>{titles[mode][1]}</p>
      <form onSubmit={submit} noValidate>
        {(mode === 'signup' || mode === 'invite') && <Field label="Full name" error={f.errs.name}><input {...f.bind('name')} autoComplete="name" required={mode === 'signup'} /></Field>}
        {['login', 'signup', 'forgot'].includes(mode) && <Field label="Email" error={f.errs.email}><input type="email" {...f.bind('email')} autoComplete="email" /></Field>}
        {['login', 'signup', 'reset', 'invite'].includes(mode) && <Field label="Password" error={f.errs.password}><input type="password" {...f.bind('password')} autoComplete={mode === 'login' ? 'current-password' : 'new-password'} /></Field>}
        {mode === 'otp' && <Field label="Sign-in code" error={f.errs.code}><input inputMode="numeric" maxLength={6} {...f.bind('code')} style={{ fontSize: 22, letterSpacing: 8, textAlign: 'center' }} autoFocus /></Field>}
        {mode === 'login' && <div style={{ textAlign: 'right', marginTop: -6, marginBottom: 12 }}><a href="#" onClick={(e) => { e.preventDefault(); go('forgot'); }} className="small">Forgot password?</a></div>}

      </form>
      <p className="small muted" style={{ textAlign: 'center', marginTop: 16 }}>{mode === 'login' ? (cfg && cfg.signupOpen === false ? <>New accounts are by invitation only.{BRAND.supportEmail ? <> Contact <a href={'mailto:' + BRAND.supportEmail}>{BRAND.supportEmail}</a>.</> : null}</> : <>New here? <a href="#" onClick={(e) => { e.preventDefault(); go('signup'); }}>Create an account</a></>) : <a href="#" onClick={(e) => { e.preventDefault(); go('login'); }}>Back to sign in</a>}</p>
      {mode === 'login' && cfg && cfg.demoAccounts.length > 0 && <div className="card card-b" style={{ marginTop: 18 }}><div className="small b" style={{ marginBottom: 8 }}>Explore the demo: Lagos Property Hub</div><div className="row wrap">{cfg.demoAccounts.map((d) => <Btn key={d.email} size="sm" onClick={() => demo(d.email)} disabled={f.busy}>{d.role}</Btn>)}</div><div className="tiny faint" style={{ marginTop: 8 }}>Each role sees a different slice of the same business.</div></div>}
    </div></div>

  </>;
}
const Kpi = ({ label, v, c, sub, onClick }) => <div className="card kpi" style={onClick ? { cursor: 'pointer' } : null} onClick={onClick}><div className="lab">{label}</div><div className="val">{v}</div><div className="sub muted">{c != null && <Delta c={c} />}{c != null && sub ? ' · ' : ''}{sub}{c != null && !sub ? <span className="faint"> vs previous</span> : null}</div></div>;

/* =================== leads =================== */
function Leads() {

    <div className="ph1"><div><h1>Leads</h1><p>{d ? d.counts.total + ' leads · ' + d.counts.hot + ' hot · ' + d.counts.uncontacted + ' not contacted yet' : 'Every enquiry, with where it came from'}</p></div>{(can['leads.write'] || can['leads.write.own']) && <Btn kind="primary" icon="plus" onClick={() => openModal({ type: 'lead' })}>New lead</Btn>}</div>
    <div className="card">
      <div className="row wrap" style={{ padding: 12, borderBottom: '1px solid var(--border2)' }}>
        <input placeholder="Search name, email, phone…" value={f.q} onChange={(e) => set('q', e.target.value)} style={{ maxWidth: 260 }} aria-label="Search leads" />
        <select value={f.status} onChange={(e) => set('status', e.target.value)} style={{ width: 'auto' }} aria-label="Status"><option value="">All statuses</option>{d && d.statuses.map((s) => <option key={s}>{s}</option>)}</select>
        <select value={f.temperature} onChange={(e) => set('temperature', e.target.value)} style={{ width: 'auto' }} aria-label="Temperature"><option value="">Hot, warm & cold</option><option value="hot">Hot</option><option value="warm">Warm</option><option value="cold">Cold</option></select>
        <select value={f.source} onChange={(e) => set('source', e.target.value)} style={{ width: 'auto' }} aria-label="Source"><option value="">All sources</option>{d && d.sources.map((s) => <option key={s}>{s}</option>)}</select>

        <label className="row small" style={{ cursor: 'pointer' }}><input type="checkbox" checked={f.mine} onChange={(e) => set('mine', e.target.checked)} />Mine</label>

        <div className="tscroll"><table className="tbl"><thead><tr><th>Lead</th><th>Interest</th><th>Source</th><th>Status</th><th>Score</th><th className="hide-m">Owner</th><th className="hide-m">Created</th><th /></tr></thead><tbody>{d.items.map((l) => <tr key={l.id} className="click" onClick={() => go('contact:' + l.contactId)}>

          <td style={{ maxWidth: 220 }}><div className="ellip">{l.title}</div>{l.value > 0 && <div className="tiny muted">{money(l.value, session.business.currency)}</div>}</td>
          <td><div>{l.source}</div>{l.utmCampaign && <div className="tiny muted ellip" style={{ maxWidth: 140 }}>{l.utmCampaign}</div>}</td>
          <td onClick={(e) => e.stopPropagation()}>{editable(l) ? <select value={l.status} onChange={(e) => setStatus(l, e.target.value)} style={{ width: 'auto', padding: '4px 8px' }} aria-label="Lead status">{d.statuses.map((s) => <option key={s}>{s}</option>)}</select> : <Badge tone={STATUS_TONE[l.status]}>{l.status}</Badge>}</td>
          <td><Temp t={l.temperature} score={l.score} /></td>
          <td className="hide-m small">{l.ownerName || '—'}</td><td className="hide-m small muted">{rel(l.createdAt)}</td>
          <td onClick={(e) => e.stopPropagation()}>{!l.convertedDealId && l.status !== 'Lost' && (can['deals.write'] || can['deals.write.own']) && editable(l) && <Btn size="sm" onClick={() => setConvert(l)}>Create deal</Btn>}</td>
        </tr>)}</tbody></table></div>}
      <Pager pg={d} onPage={(p) => set('page', p)} />
    </div>

          <div className="row wrap" style={{ marginTop: 8 }}>{log.type === 'call' && <select value={log.outcome} onChange={(e) => setLog({ ...log, outcome: e.target.value })} style={{ width: 'auto' }} aria-label="Call outcome"><option value="">Outcome…</option><option>Answered</option><option>No answer</option><option>Busy</option><option>Wrong number</option></select>}<label className="small muted row">Follow up<input type="datetime-local" value={log.followUpAt} onChange={(e) => setLog({ ...log, followUpAt: e.target.value })} style={{ width: 'auto' }} /></label><div className="grow" /><Btn kind="primary" busy={busy} disabled={!log.summary.trim()} onClick={submitLog}>Log {log.type}</Btn></div>

        <div className="card"><div className="card-h"><h3>Timeline</h3><span className="tiny muted">{d.timeline.length} events</span></div><div className="card-b">{!d.timeline.length ? <div className="muted small">No activity yet.</div> : <div className="tl">{d.timeline.map((a) => <div key={a.id} className="ev"><span className="dot" style={{ display: 'grid', placeItems: 'center' }} /><div className="row" style={{ alignItems: 'flex-start' }}><Icon n={ACT_ICON[a.type] || 'list'} s={14} style={{ color: 'var(--muted)', marginTop: 2 }} /><div className="grow"><div>{a.summary}</div><div className="tiny faint">{(a.meta && a.meta.label) || a.type.replace('_', ' ')} · {a.actorName} · {fmtDate(a.at, true)}{a.meta && a.meta.outcome ? ' · ' + a.meta.outcome : ''}</div></div></div></div>)}</div>}</div></div>

        {d.finance && <ContactFinanceCard c={c} f={d.finance} />}
        {can['orders.read.own'] && hasMod(session, 'orders') && <ContactOrdersCard c={c} />}
        <div className="card"><div className="card-h"><h3>Deals</h3></div>{!d.deals.length ? <div className="card-b small muted">No deals yet.</div> : d.deals.map((x) => <div key={x.id} className="row" style={{ padding: '10px 16px', borderBottom: '1px solid var(--border2)', cursor: 'pointer' }} onClick={() => go('deal:' + x.id)}><div className="grow"><div className="ellip">{x.title}</div><div className="tiny muted">{x.stageName} · {x.ownerName}</div></div><div style={{ textAlign: 'right' }}><b>{money(x.value, cur)}</b><div><Badge tone={x.status === 'won' ? 'green' : x.status === 'lost' ? 'red' : 'blue'}>{x.status}</Badge></div></div></div>)}</div>
        <div className="card"><div className="card-h"><h3>Leads & attribution</h3></div>{d.leads.map((l) => <div key={l.id} style={{ padding: '10px 16px', borderBottom: '1px solid var(--border2)' }}><div className="row between"><span className="ellip">{l.title}</span><Badge tone={STATUS_TONE[l.status]}>{l.status}</Badge></div><div className="tiny muted">{l.source}{l.utmCampaign ? ' · ' + l.utmCampaign : ''}{l.utmMedium ? ' · ' + l.utmMedium : ''} · {fmtDate(l.createdAt)}</div>{l.message && <div className="small" style={{ marginTop: 4, whiteSpace: 'pre-wrap' }}>"{l.message}"</div>}</div>)}{!d.leads.length && <div className="card-b small muted">Added directly, not from a lead.</div>}</div>
        <div className="card"><div className="card-h"><h3>Tasks</h3>{(can['tasks.write'] || can['tasks.write.own']) && <Btn size="sm" icon="plus" onClick={() => openModal({ type: 'task', init: { contactId: c.id, title: 'Follow up with ' + c.name } })}>Task</Btn>}</div>{!d.tasks.length ? <div className="card-b small muted">No tasks.</div> : d.tasks.map((t) => <div key={t.id} className="row" style={{ padding: '9px 16px', borderBottom: '1px solid var(--border2)' }}><input type="checkbox" checked={t.status === 'Completed'} onChange={() => toggleTask(t)} aria-label="Complete task" /><div className="grow"><div className="ellip" style={{ textDecoration: t.status === 'Completed' ? 'line-through' : 'none' }}>{t.title}</div><div className="tiny muted">{t.assigneeName} · {fmtDate(t.dueAt, true)}</div></div></div>)}</div>
        {can['appointments.read'] && hasMod(session, 'appointments') && <ContactApptCard c={c} />}
        {d.comingSoon && d.comingSoon.length > 0 && <div className="card card-b"><div className="small b">Coming to this view</div><div className="row wrap" style={{ marginTop: 6 }}>{d.comingSoon.map((x) => <Badge key={x}>{x}</Badge>)}</div></div>}
      </div>
    </div>
    {edit && <ContactModal contact={{ ...c }} onClose={() => setEdit(false)} onSaved={() => { setEdit(false); reload(); }} />}
    {del && <Confirm title="Delete contact?" danger okLabel="Delete" text={`${c.name} will be removed from your CRM. This is logged in the audit trail.`} onClose={() => setDel(false)} onOk={async () => { await api('contacts.remove', { id: c.id }); toast('Contact deleted'); nav('contacts'); }} />}
  </>;
}

function Deals({ openId }) {
  const { session, toast, openModal, tick, nav } = useApp(); const can = session.can; const cur = session.business.currency;
  const [pid, setPid] = useState(''); const [owner, setOwner] = useState(''); const [q, setQ] = useState('');
  const [st, reload, patch] = useLoad(() => api('deals.board', { pipelineId: pid, ownerId: owner, q }), [pid, owner, q, tick]);
  const [drag, setDrag] = useState(null); const [over, setOver] = useState(null); const [lost, setLost] = useState(null);
  const d = st.data;
  const canMove = (x) => can['deals.write'] || (can['deals.write.own'] && x.ownerId === session.user.id);
  const move = async (deal, stage, reason) => {
    if (stage.isLost && !reason) return setLost({ deal, stage });
    const prev = d;
    patch((s) => ({ ...s, stages: s.stages.map((c) => ({ ...c, deals: c.id === stage.id ? [{ ...deal, stageId: stage.id }, ...c.deals.filter((x) => x.id !== deal.id)] : c.deals.filter((x) => x.id !== deal.id) })).map((c) => ({ ...c, count: c.deals.length, total: c.deals.reduce((a, x) => a + (x.value || 0), 0) })) }));
    try { await api('deals.move', { id: deal.id, stageId: stage.id, lostReason: reason }); toast(stage.isWon ? '🎉 Deal won — ' + money(deal.value, cur) : 'Moved to ' + stage.name); reload(); } catch (e) { patch(prev); toast(e.message, true); }
  };
  return <>
    <div className="ph1"><div><h1>Deals</h1><p>{d ? d.stages.filter((s) => !s.isWon && !s.isLost).reduce((a, s) => a + s.count, 0) + ' open · ' + money(d.stages.filter((s) => !s.isWon && !s.isLost).reduce((a, s) => a + s.total, 0), cur) + ' in pipeline' : 'Drag deals between stages'}</p></div>
      <div className="row wrap">{d && d.pipelines.length > 1 && <select value={pid || d.pipeline.id} onChange={(e) => setPid(e.target.value)} style={{ width: 'auto' }} aria-label="Pipeline">{d.pipelines.map((p) => <option key={p.id} value={p.id}>{p.name}</option>)}</select>}
        <input placeholder="Search deals" value={q} onChange={(e) => setQ(e.target.value)} style={{ width: 170 }} aria-label="Search deals" /><div style={{ width: 170 }}><OwnerSelect value={owner} onChange={setOwner} allowEmpty="All owners" /></div>
        {can['pipelines.manage'] && <Btn onClick={() => nav('settings', 'pipelines')}>Edit stages</Btn>}{(can['deals.write'] || can['deals.write.own']) && <Btn kind="primary" icon="plus" onClick={() => openModal({ type: 'deal', init: { pipelineId: d && d.pipeline.id } })}>New deal</Btn>}</div></div>
    {st.loading && !d ? <div className="board">{[1, 2, 3, 4].map((i) => <div key={i} className="col"><div className="col-b"><Skel h={70} /><Skel h={70} /></div></div>)}</div> : st.error ? <ErrorBox error={st.error} retry={reload} /> :
      <div className="board">{d.stages.map((s) => <div key={s.id} className={'col' + (over === s.id ? ' over' : '')} onDragOver={(e) => { if (drag) { e.preventDefault(); setOver(s.id); } }} onDragLeave={() => setOver((o) => (o === s.id ? null : o))} onDrop={(e) => { e.preventDefault(); setOver(null); if (drag && drag.stageId !== s.id) move(drag, s); setDrag(null); }}>
        <div className="col-h"><div className="row between"><b className="ellip" style={{ color: s.isWon ? 'var(--ok)' : s.isLost ? 'var(--bad)' : 'inherit' }}>{s.name}</b><span className="badge">{s.count}</span></div><div className="tiny muted" style={{ marginTop: 2 }}>{money(s.total, cur)}{!s.isWon && !s.isLost && s.total ? ' · ' + s.probability + '% → ' + money(s.weighted, cur) : ''}</div></div>
        <div className="col-b">{!s.deals.length && <div className="tiny faint" style={{ textAlign: 'center', padding: '14px 0' }}>{s.isWon || s.isLost ? 'Last 60 days' : 'Drop deals here'}</div>}{s.deals.map((x) => <div key={x.id} className="dcard" draggable={canMove(x)} onDragStart={() => setDrag(x)} onDragEnd={() => { setDrag(null); setOver(null); }} onClick={() => nav('deals', x.id)} style={{ cursor: canMove(x) ? 'grab' : 'pointer', opacity: drag && drag.id === x.id ? 0.5 : 1 }}>
          <div className="small b" style={{ lineHeight: 1.3 }}>{x.title}</div><div className="row between" style={{ marginTop: 6 }}><b style={{ fontSize: 13 }}>{money(x.value, cur)}</b><span className="tiny muted">{x.ageDays}d</span></div>
          <div className="row" style={{ marginTop: 6 }}><Avatar name={x.ownerName} size={20} /><span className="tiny muted ellip grow">{x.contactName || 'No contact'}</span></div></div>)}</div></div>)}</div>}
    <div className="tiny faint" style={{ marginTop: 6 }}>On mobile, tap a deal and change its stage from the details panel.</div>
    {openId && <DealDrawer id={openId} onClose={() => nav('deals')} onChanged={reload} />}
    {lost && <LostModal title={'Why was "' + lost.deal.title + '" lost?'} onClose={() => setLost(null)} onOk={(r) => move(lost.deal, lost.stage, r)} />}
  </>;
}
function DealDrawer({ id, onClose, onChanged }) {
  const { session, toast, go, openModal } = useApp(); const can = session.can; const cur = session.business.currency;

  const x = st.data; const editable = x && (can['deals.write'] || (can['deals.write.own'] && x.ownerId === session.user.id));
  const move = async (sid, reason) => { const s = stages.find((y) => y.id === sid); if (s.isLost && !reason) return setLostStage(s); try { await api('deals.move', { id, stageId: sid, lostReason: reason }); toast(s.isWon ? '🎉 Deal won' : 'Moved to ' + s.name); reload(); onChanged(); } catch (e) { toast(e.message, true); } };
  const save = async () => { try { await api('deals.update', { id, title: edit.title, value: Number(edit.value) || 0, expectedClose: edit.expectedClose || '', ownerId: edit.ownerId }); toast('Deal updated'); setEdit(null); reload(); onChanged(); } catch (e) { toast(e.message, true); } };
  return <Drawer onClose={onClose}>{!x ? <div className="card-b">{st.error ? <ErrorBox error={st.error} /> : <><Skel h={30} /><Skel h={200} /></>}</div> : <>
    <div className="card-h" style={{ position: 'sticky', top: 0, background: 'var(--panel)', zIndex: 2 }}><div className="grow"><div className="tiny muted">Deal</div><h3 className="ellip" style={{ fontSize: 16 }}>{x.title}</h3></div><button className="btn ghost icon" onClick={onClose} aria-label="Close"><Icon n="x" /></button></div>
    <div className="card-b">
      <div className="row wrap" style={{ gap: 18, marginBottom: 14 }}><div><div className="tiny muted">Value</div><div style={{ fontSize: 22, fontWeight: 700 }}>{moneyFull(x.value, cur)}</div></div><div><div className="tiny muted">Status</div><Badge tone={x.status === 'won' ? 'green' : x.status === 'lost' ? 'red' : 'blue'}>{x.status}</Badge></div><div><div className="tiny muted">Owner</div>{x.ownerName}</div><div><div className="tiny muted">Expected close</div>{x.expectedClose ? fmtDate(x.expectedClose + 'T12:00:00') : '—'}</div></div>
      <Field label="Stage">{editable ? <select value={x.stageId} onChange={(e) => move(e.target.value)}>{stages.map((s) => <option key={s.id} value={s.id}>{s.name}</option>)}</select> : <div>{x.stageName}</div>}</Field>
      {x.lostReason && <div className="small" style={{ marginBottom: 10 }}><span className="muted">Lost reason:</span> {x.lostReason}</div>}
      <div className="row wrap" style={{ marginBottom: 16 }}>{x.contactId && <Btn icon="users" onClick={() => go('contact:' + x.contactId)}>{x.contactName}</Btn>}{editable && <Btn icon="edit" onClick={() => setEdit({ title: x.title, value: x.value, expectedClose: x.expectedClose, ownerId: x.ownerId })}>Edit</Btn>}{(can['tasks.write'] || can['tasks.write.own']) && <Btn icon="plus" onClick={() => openModal({ type: 'task', init: { dealId: x.id, contactId: x.contactId, title: 'Next step on ' + x.title } })}>Task</Btn>}{can['deals.delete'] && <Btn kind="ghost" className="btn ghost danger" icon="trash" onClick={() => setDel(true)}>Delete</Btn>}</div>
      <DealMoney deal={x} />
      {can['orders.read.own'] && hasMod(session, 'orders') && <LinkedOrders filter={{ dealId: x.id }} create={x.status === 'won' || x.status === 'open' ? { action: 'orders.fromDeal', data: { dealId: x.id } } : null} />}
      <h4 style={{ margin: '0 0 8px' }}>Tasks</h4>{!x.tasks.length ? <div className="small muted" style={{ marginBottom: 14 }}>No tasks.</div> : x.tasks.map((t) => <div key={t.id} className="small" style={{ marginBottom: 6 }}>{t.status === 'Completed' ? '✓ ' : '○ '}{t.title} <span className="muted">· {fmtDate(t.dueAt)}</span></div>)}
      <h4 style={{ margin: '16px 0 8px' }}>Timeline</h4><div className="tl">{x.timeline.map((a) => <div key={a.id} className="ev"><span className="dot" /><div>{a.summary}</div><div className="tiny faint">{a.actorName} · {fmtDate(a.at, true)}</div></div>)}</div>
    </div>
    {edit && <Modal title="Edit deal" onClose={() => setEdit(null)} footer={<><Btn onClick={() => setEdit(null)}>Cancel</Btn><Btn kind="primary" onClick={save}>Save</Btn></>}><Field label="Title"><input value={edit.title} onChange={(e) => setEdit({ ...edit, title: e.target.value })} /></Field><div className="grid g2" style={{ gap: 10 }}><Field label={'Value (' + cur + ')'}><input type="number" min="0" value={edit.value} onChange={(e) => setEdit({ ...edit, value: e.target.value })} /></Field><Field label="Expected close"><input type="date" value={edit.expectedClose || ''} onChange={(e) => setEdit({ ...edit, expectedClose: e.target.value })} /></Field></div>{can['deals.write'] && <Field label="Owner"><OwnerSelect value={edit.ownerId} onChange={(v) => setEdit({ ...edit, ownerId: v })} /></Field>}</Modal>}
    {lostStage && <LostModal title="Why was this deal lost?" onClose={() => setLostStage(null)} onOk={(r) => move(lostStage.id, r)} />}
    {del && <Confirm title="Delete deal?" danger okLabel="Delete" text="The deal is removed from the pipeline. The action is recorded in the audit log." onClose={() => setDel(false)} onOk={async () => { await api('deals.remove', { id }); toast('Deal deleted'); onChanged(); onClose(); }} />}
  </>}</Drawer>;
}
function DealModal({ init, onClose, onSaved }) {
  const { session, toast } = useApp(); init = init || {};
  const [pls, setPls] = useState([]);

  useEffect(() => { api('pipelines.list').then((p) => { setPls(p); const def = p.find((x) => x.id === init.pipelineId) || p.find((x) => x.isDefault) || p[0]; if (def) f.setV((s) => ({ ...s, pipelineId: def.id, stageId: def.stages[0] && def.stages[0].id })); }).catch(() => {}); }, []); // eslint-disable-line
  const pl = pls.find((p) => p.id === f.v.pipelineId);
  const save = () => f.run(async () => {
    const d = { title: f.v.title, contactId: f.v.contactId, pipelineId: f.v.pipelineId, stageId: f.v.stageId, value: f.v.value === '' ? 0 : Number(f.v.value), ownerId: f.v.ownerId, expectedClose: f.v.expectedClose };
    const r = f.v.leadId ? await api('leads.convert', { id: f.v.leadId, pipelineId: d.pipelineId, stageId: d.stageId, title: d.title, value: d.value }) : await api('deals.create', d);
    toast('Deal created'); onSaved(r);
  }).catch((e) => !e.field && toast(e.message, true));
  return <Modal title={init.leadId ? 'Create deal from lead' : 'New deal'} onClose={onClose} footer={<><Btn onClick={onClose}>Cancel</Btn><Btn kind="primary" busy={f.busy} disabled={!f.v.title || !f.v.stageId} onClick={save}>Create deal</Btn></>}>
    <Field label="Deal title" error={f.errs.title}><input {...f.bind('title')} autoFocus placeholder="e.g. 3 Bedroom Apartment — Kemi Bello" /></Field>
    {!init.leadId && <Field label="Contact" error={f.errs.contactId}><ContactPicker value={f.v.contactId} initialLabel={init.contactName} onChange={(id) => f.setV((s) => ({ ...s, contactId: id }))} /></Field>}
    {init.leadId && <div className="small muted" style={{ marginBottom: 12 }}>For {init.contactName}. The lead moves to Qualified and keeps its source attribution.</div>}
    <div className="grid g2" style={{ gap: 10 }}><Field label={'Value (' + session.business.currency + ')'} error={f.errs.value}><input type="number" min="0" {...f.bind('value')} /></Field><Field label="Expected close"><input type="date" {...f.bind('expectedClose')} /></Field>
      {pls.length > 1 && <Field label="Pipeline"><select value={f.v.pipelineId} onChange={(e) => { const p = pls.find((x) => x.id === e.target.value); f.setV((s) => ({ ...s, pipelineId: p.id, stageId: p.stages[0].id })); }}>{pls.map((p) => <option key={p.id} value={p.id}>{p.name}</option>)}</select></Field>}
      <Field label="Stage"><select {...f.bind('stageId')}>{pl && pl.stages.filter((s) => !s.isWon && !s.isLost).map((s) => <option key={s.id} value={s.id}>{s.name}</option>)}</select></Field></div>
    {session.can['deals.write'] && !init.leadId && <Field label="Owner"><OwnerSelect value={f.v.ownerId} onChange={(v) => f.setV({ ...f.v, ownerId: v })} /></Field>}
  </Modal>;
}

/* =================== tasks =================== */
function Tasks() {
  const { session, toast, openModal, tick, go } = useApp(); const can = session.can;
  const [f, setF] = useState({ scope: can['tasks.write'] ? 'all' : 'mine', status: 'open', overdue: false, q: '', page: 1 });
  const [st, reload, patch] = useLoad(() => api('tasks.list', { ...f, pageSize: 30 }), [JSON.stringify(f), tick]);
  const set = (k, v) => setF((s) => ({ ...s, [k]: v, page: k === 'page' ? v : 1 })); const d = st.data;
  const toggle = async (t) => { const status = t.status === 'Completed' ? 'To Do' : 'Completed'; patch((s) => ({ ...s, items: s.items.map((x) => x.id === t.id ? { ...x, status } : x) })); try { await api('tasks.update', { id: t.id, status }); if (status === 'Completed') toast('Task completed'); reload(); } catch (e) { toast(e.message, true); reload(); } };
  const setStatus = async (t, status) => { try { await api('tasks.update', { id: t.id, status }); reload(); } catch (e) { toast(e.message, true); } };
  const PRI = { Urgent: 'red', High: 'amber', Medium: '', Low: '' };
  const editable = (t) => can['tasks.write'] || t.assigneeId === session.user.id;

function DayBars({ rows, keys, ariaLabel }) {
  const W = 760, H = 200, P = { l: 34, r: 8, t: 10, b: 24 }, iw = W - P.l - P.r, ih = H - P.t - P.b, n = Math.max(1, rows.length);
  const max = Math.max(1, ...rows.map((r) => Math.max(...keys.map((k) => r[k.key] || 0)))), y = (v) => P.t + ih - (v / max) * ih, bw = Math.max(2, (iw / n) * 0.75 / keys.length), step = Math.max(1, Math.ceil(n / 8));
  return <svg viewBox={`0 0 ${W} ${H}`} style={{ width: '100%', height: 'auto', display: 'block' }} role="img" className="daybars" aria-label={ariaLabel}>
    {[0, 0.5, 1].map((f) => <g key={f}><line x1={P.l} x2={W - P.r} y1={y(max * f)} y2={y(max * f)} stroke="var(--border2)" /><text className="chart-t" x={P.l - 5} y={y(max * f) + 4} textAnchor="end">{Math.round(max * f)}</text></g>)}
    {rows.map((r, i) => <g key={i}>{keys.map((k, j) => { const v = r[k.key] || 0; return <rect key={k.key} x={P.l + (iw / n) * i + (iw / n) * 0.125 + j * bw} y={y(v)} width={bw - 0.5} height={Math.max(0, y(0) - y(v))} rx="1.5" fill={k.color}><title>{shortDay(r.day)} · {k.label}: {v}</title></rect>; })}</g>)}
    {rows.map((r, i) => (i % step === 0 ? <text key={'t' + i} className="chart-t" x={P.l + (iw / n) * (i + 0.5)} y={H - 6} textAnchor="middle">{shortDay(r.day)}</text> : null))}
  </svg>;
}

    </div>
    {hasCheckout && !m.payments.online && <div className="note warn small" style={{ marginBottom: 12 }}>Online payments aren't connected, so checkout steps send buyers an invoice with your bank details. Connect Paystack or Flutterwave in Settings → Payments for card checkout.</div>}
    {hasCheckout && m.payments.online && m.payments.test && <div className="note small" style={{ marginBottom: 12 }}>Payments are in <b>test mode</b> — no real money moves until you switch your provider to live keys.</div>}
    {hasBooking && !m.bookingReady && <div className="note warn small" style={{ marginBottom: 12 }}>The booking step needs online booking. Set up a booking type under Appointments.</div>}
    <div className="grid g4" style={{ marginBottom: 14 }}>
      <Kpi label="Visitors" v={stats.visitors.toLocaleString()} sub="first step" />

      {f.goal === 'sales' || hasCheckout ? <Kpi label="Revenue (verified)" v={money(stats.revenue, cur)} sub={stats.paid + ' paid of ' + stats.orders + ' checkout' + (stats.orders === 1 ? '' : 's')} /> : <Kpi label="Steps" v={steps.length} sub={live ? 'all live' : 'draft'} />}

            <StepName step={s} onSave={(v) => run('rn', 'funnels.updateStep', { stepId: s.id, name: v })} />
            <div className="fbar" title={fpct(x.ofFirst) + ' of first-step visitors'}><i style={{ width: Math.min(100, x.ofFirst || 0) + '%' }} /></div>

              <button className="btn ghost icon sm" disabled={i === 0 || !!busy} onClick={() => move(i, -1)} aria-label="Move earlier"><Icon n="back" s={13} /></button><button className="btn ghost icon sm" disabled={i === steps.length - 1 || !!busy} onClick={() => move(i, 1)} aria-label="Move later"><Icon n="arrow" s={13} /></button><button className="btn ghost icon sm danger" onClick={() => setRm(s)} aria-label={'Remove ' + s.name}><Icon n="trash" s={13} /></button></div>
          </div>
          {i < steps.length - 1 && <div className="farrow" title="Visitors who reached the next step"><Icon n="arrow" s={16} />{x.toNext != null && <span className="tiny">{x.toNext}%</span>}</div>}
        </React.Fragment>; })}
        {steps.length < 8 && <button className="fstep fadd" onClick={() => setAdd({ kind: 'thanks', name: '', productId: (m.products.find((p) => p.price > 0) || {}).id || '', index: steps.length })}><Icon n="plus" s={20} /><span>Add step</span></button>}

        <div className="grid g2" style={{ gap: 8 }}><Field label="Fonts"><select value={look.font || 'modern'} onChange={(e) => setLook({ ...look, font: e.target.value })}>{Object.keys(m.fonts).map((k) => <option key={k} value={k}>{m.fonts[k]}</option>)}</select></Field><Field label="Colour" hint="Empty uses your brand colour"><div className="row"><input type="color" value={look.color || session.business.brandColor || '#2563EB'} onChange={(e) => setLook({ ...look, color: e.target.value })} style={{ width: 48, padding: 2 }} /><input value={look.color || ''} onChange={(e) => setLook({ ...look, color: e.target.value })} /></div></Field></div>
        <Btn kind="primary" size="sm" busy={busy === 'look'} disabled={!lookDirty} onClick={() => run('look', 'funnels.save', { settings: look }, 'Applied to every step')}>Apply to all steps</Btn></div>

        <li>Every sign-up becomes a lead in your CRM with its source and campaign, so your workflows and follow-ups run as usual.</li>
        {hasCheckout && <li>A checkout creates a real invoice. It's marked paid only when your payment provider confirms it, then the buyer continues to the next step. Unpaid checkouts are cancelled after 3 days.</li>}
        <li>Track ads by building links on the Campaigns page with this funnel's first step as the landing page.</li></ul></div>
    </div>
    {add && <AddStepModal m={m} f={f} init={add} onClose={() => setAdd(null)} onDone={(r) => { setF(r); setAdd(null); toast('Step added'); }} />}
    {rm && <Confirm title={'Remove "' + rm.name + '"?'} danger okLabel="Remove step" text="Its page is deleted. Leads and payments it already collected stay in your CRM and finance." onClose={() => setRm(null)} onOk={async () => { await run('rm', 'funnels.removeStep', { stepId: rm.id }, 'Step removed'); }} />}
    {del && <Confirm title={'Delete "' + f.name + '"?'} danger okLabel="Delete funnel" text="All its step pages are deleted and their links stop working. Leads, invoices and payments stay in your CRM and finance." onClose={() => setDel(false)} onOk={async () => { await api('funnels.remove', { id }); toast('Funnel deleted'); nav('funnels'); }} />}
  </>;
}
function AddStepModal({ m, f, init, onClose, onDone }) {
  const { toast } = useApp(); const [d, setD] = useState(init); const [busy, setBusy] = useState(false); const kind = m.kinds.find((k) => k.key === d.kind) || {};
  const priced = m.products.filter((p) => p.price > 0);
  const go = async () => { setBusy(true); try { onDone(await api('funnels.addStep', { id: f.id, kind: d.kind, name: d.name.trim() || kind.label, productId: kind.needs === 'product' ? d.productId : undefined, index: Number(d.index) })); } catch (e) { toast(e.message, true); } finally { setBusy(false); } };
  return <Modal title="Add a step" width={620} onClose={onClose} footer={<><Btn onClick={onClose}>Cancel</Btn><Btn kind="primary" busy={busy} disabled={kind.needs === 'product' && !d.productId} onClick={go}>Add step</Btn></>}>
    <div className="kindgrid">{m.kinds.map((k) => <button key={k.key} className={'kind' + (d.kind === k.key ? ' on' : '')} onClick={() => setD({ ...d, kind: k.key })}><Icon n={STEP_IC[k.key] || 'list'} s={18} /><span>{k.label}</span></button>)}</div>
    <div className="grid g2" style={{ gap: 8, marginTop: 12 }}><Field label="Step name"><input value={d.name} onChange={(e) => setD({ ...d, name: e.target.value })} placeholder={kind.label} /></Field>
      <Field label="Position"><select value={d.index} onChange={(e) => setD({ ...d, index: e.target.value })}>{f.steps.map((s, i) => <option key={s.id} value={i}>Before “{s.name}”</option>)}<option value={f.steps.length}>At the end</option></select></Field></div>
    {kind.needs === 'product' && (priced.length ? <Field label="Product"><select value={d.productId} onChange={(e) => setD({ ...d, productId: e.target.value })}>{priced.map((p) => <option key={p.id} value={p.id}>{p.name}</option>)}</select></Field> : <div className="note warn small">Add a product with a price under Sales → Products & services first.</div>)}
    <div className="tiny muted">The step starts as a ready-made page with photos and placeholder text — edit it like any other page.</div>
  </Modal>;
}

/** Tiny, safe formatter for AI text: escapes everything, then **bold**, _italic_, "- " bullets and line breaks. */
function AiText({ text }) {
  const inline = (s, k) => { const out = []; let rest = s, i = 0; const re = /(\*\*[^*]+\*\*|_[^_]+_)/; let m;
    while ((m = rest.match(re))) { if (m.index) out.push(rest.slice(0, m.index)); const t = m[0]; out.push(t.startsWith('**') ? <b key={k + '-' + i++}>{t.slice(2, -2)}</b> : <i key={k + '-' + i++}>{t.slice(1, -1)}</i>); rest = rest.slice(m.index + t.length); }
    if (rest) out.push(rest); return out; };
  const lines = String(text || '').split('\n'); const blocks = []; let list = null;
  lines.forEach((l, k) => { const b = l.match(/^\s*[-•*]\s+(.*)/) || l.match(/^\s*\d+[.)]\s+(.*)/); if (b) { if (!list) { list = []; blocks.push(<ul key={'u' + k} className="ai-ul">{list}</ul>); } list.push(<li key={k}>{inline(b[1], k)}</li>); } else { list = null; if (l.trim()) blocks.push(<p key={k} className="ai-p">{inline(l.replace(/^#+\s*/, ''), k)}</p>); } });
  return <div className="ai-text">{blocks}</div>;
}

const BLANK_WF = { name: '', description: '', trigger: { event: 'lead.created' }, steps: [], settings: { reentry: 'after_finish', onError: 'continue' } };
function WorkflowBuilder({ id }) {
  const { session, nav, toast } = useApp(); const manage = session.can['automations.manage'];
  const [m, merr, reloadMeta] = useWfMeta();
  const [w, setW] = useState(id ? null : { ...BLANK_WF, steps: [] }); const [saved, setSaved] = useState(id ? null : BLANK_WF); const [err, setErr] = useState(null);
  const [busy, setBusy] = useState(''); const [leave, setLeave] = useState(false); const [stopAsk, setStopAsk] = useState(false); const [tab, setTab] = useState('build');
  useEffect(() => { if (id) api('workflows.get', { id }).then((r) => { setW(r); setSaved(r); }).catch(setErr); }, [id]);
  const dirty = w && saved && JSON.stringify([w.name, w.description, w.trigger, w.steps, w.settings]) !== JSON.stringify([saved.name, saved.description, saved.trigger, saved.steps, saved.settings]);
  if (err || merr) return <ErrorBox error={err || merr} retry={() => { setErr(null); reloadMeta(); }} />;
  if (!w || !m) return <LoadingCard />;
  const set = (patch) => setW((s) => ({ ...s, ...patch }));
  const setStep = (i, patch) => setW((s) => ({ ...s, steps: s.steps.map((x, j) => (j === i ? { ...x, ...patch } : x)) }));
  const addStep = (at, type) => { const st = type === 'delay' ? { type, amount: 1, unit: 'days', businessHours: false } : type === 'condition' ? { type, match: 'all', rules: [{ field: 'contact.lifecycle', op: 'is', value: 'lead' }] } : { type: 'action', action: 'send_message', params: { channel: 'auto', body: '' } }; st.id = newStepId(); setW((s) => { const a = s.steps.slice(); a.splice(at, 0, st); return { ...s, steps: a }; }); };
  const move = (i, dir) => setW((s) => { const a = s.steps.slice(), j = i + dir; if (j < 0 || j >= a.length) return s; [a[i], a[j]] = [a[j], a[i]]; return { ...s, steps: a }; });

const DOC_TONE = { Draft: '', Sent: 'blue', 'Partially Paid': 'amber', Overdue: 'red', Paid: 'green', Cancelled: '', Accepted: 'green', Rejected: 'red', Expired: 'amber' };
const PAY_TONE = { success: 'green', partially_refunded: 'amber', refunded: '', pending: '', abandoned: '', failed: 'red', review: 'red', cancelled: '' };
const PAY_LABEL = { success: 'Received', partially_refunded: 'Part refunded', refunded: 'Refunded', pending: 'Started', abandoned: 'Abandoned', failed: 'Failed', review: 'Needs review', cancelled: 'Cancelled' };
const METHODS = [['bank_transfer', 'Bank transfer'], ['cash', 'Cash'], ['pos', 'POS'], ['card', 'Card'], ['cheque', 'Cheque'], ['mobile_money', 'Mobile money'], ['other', 'Other']];
const r2 = (n) => Math.round((Number(n) || 0) * 100) / 100;
const moneyX = (n, c) => { const v = r2(n); return (v < 0 ? '-' : '') + (SYM[c || 'NGN'] || '') + Math.abs(v).toLocaleString(undefined, { minimumFractionDigits: Math.abs(v) % 1 ? 2 : 0, maximumFractionDigits: 2 }); };
const dayStr = (d) => { const x = d || new Date(); const p = (n) => String(n).padStart(2, '0'); return `${x.getFullYear()}-${p(x.getMonth() + 1)}-${p(x.getDate())}`; };
const addDaysStr = (s, n) => { const d = new Date(s + 'T12:00:00'); d.setDate(d.getDate() + n); return dayStr(d); };
const addMonthsStr = (s, n) => { const d = new Date(s + 'T12:00:00'), day = d.getDate(); d.setDate(1); d.setMonth(d.getMonth() + n); const last = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate(); d.setDate(Math.min(day, last)); return dayStr(d); };
const fmtDay = (s) => (s ? new Date(s + 'T12:00:00').toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' }) : '—');
function calcTotals(items, discount, taxRate) {
  let sub = 0, taxable = 0;
  const lines = items.map((it) => { const t = r2((Number(it.qty) || 0) * (Number(it.unitPrice) || 0) * (1 - (Number(it.discountPct) || 0) / 100)); sub += t; if (it.taxable) taxable += t; return t; });
  sub = r2(sub); const disc = r2(discount); const f = sub ? 1 - disc / sub : 1; const tax = r2(taxable * f * (Number(taxRate) || 0) / 100);
  return { lines, subtotal: sub, discount: disc, tax, total: r2(sub - disc + tax) };
}
function downloadB64(p) {
  try { const bin = atob(p.base64), arr = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i); const url = URL.createObjectURL(new Blob([arr], { type: p.mime })); const a = document.createElement('a'); a.href = url; a.download = p.name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 2000); return true; } catch (e) { return false; }
}
const readFileB64 = (file) => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res({ name: file.name, type: file.type, data: String(r.result).split(',')[1] }); r.onerror = rej; r.readAsDataURL(file); });
const waLink = (phone, text) => { const d = String(phone || '').replace(/[^\d]/g, '').replace(/^0/, '234'); return 'https://wa.me/' + d + '?text=' + encodeURIComponent(text); };
const openTop = (url) => { try { window.open(url, '_top'); } catch (e) { location.href = url; } };
const copyText = (t, toast) => { try { navigator.clipboard.writeText(t).then(() => toast('Link copied'), () => toast('Select and copy the link manually', true)); } catch (e) { toast('Select and copy the link manually', true); } };
function usePdf() { const { toast } = useApp(); return async (action, data) => { try { const p = await api(action, data); if (!downloadB64(p)) toast('Download blocked by the browser — use Open and print instead', true); } catch (e) { toast(e.message, true); } }; }

const shortTime = (iso) => { if (!iso) return ''; const d = new Date(iso), n = new Date(); if (d.toDateString() === n.toDateString()) return d.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' }); const y = new Date(n); y.setDate(n.getDate() - 1); if (d.toDateString() === y.toDateString()) return 'Yesterday'; return d.toLocaleDateString(undefined, { day: 'numeric', month: 'short' }); };
const hoursLeft = (iso) => { const ms = new Date(iso).getTime() - Date.now(); if (ms <= 0) return ''; const h = Math.floor(ms / 3600e3), m = Math.floor((ms % 3600e3) / 60000); return h ? h + 'h ' + m + 'm' : m + 'm'; };
const Ticks = ({ s }) => s === 'read' ? <span style={{ color: '#3b82f6' }} title="Read">✓✓</span> : s === 'delivered' ? <span className="faint" title="Delivered">✓✓</span> : s === 'sent' ? <span className="faint" title="Sent">✓</span> : s === 'queued' ? <span className="faint" title="Queued — retrying">🕓</span> : s === 'failed' ? <span className="down" title="Failed">!</span> : null;

/* ---------- media in a message ---------- */
function MediaBubble({ m }) {
  const { toast } = useApp(); const [src, setSrc] = useState(null); const [busy, setBusy] = useState(false);

  if (src) { if (/^image\//.test(src.mime)) return <img src={src.url} alt={m.mediaName || 'Photo'} style={{ maxWidth: 260, borderRadius: 8, display: 'block' }} />; if (/^audio\//.test(src.mime)) return <audio controls src={src.url} style={{ maxWidth: 260 }} />; if (/^video\//.test(src.mime)) return <video controls src={src.url} style={{ maxWidth: 260 }} />; return <a href={src.url} download={m.mediaName || 'file'}>Download {m.mediaName || 'file'}</a>; }

/* ---------- send a message from anywhere (Customer 360, invoices, quotes) ---------- */
function MessageModal({ contact, doc, onClose, onSent }) {
  const { session, toast, nav } = useApp(); const chs = session.channels || {};
  const avail = ['whatsapp', 'email', 'sms'].filter((k) => chs[k] && (k === 'email' ? contact.email : contact.phone || contact.whatsapp));

  useEffect(() => { if (ch === 'whatsapp') api('templates.list').then((r) => setTpls(r.whatsapp.filter((t) => t.status === 'APPROVED'))).catch(() => {}); }, [ch]);
  const send = async () => { setBusy(true); setHint(''); try {
    const base = { contactId: contact.id, channel: ch };
    const r = await api('inbox.start', tpl ? { ...base, kind: 'template', templateId: tpl.t.id, params: tpl.params } : doc && ch !== 'sms' ? { ...base, kind: 'document', docType: doc.type, docId: doc.id, body: text } : { ...base, kind: 'text', body: text + (doc && ch === 'sms' ? '\n' + doc.url : '') });
    if (r.message.status === 'failed') { toast('Not delivered: ' + r.message.error, true); } else { toast('Sent on ' + CH_LABEL[ch]); onSent && onSent(r); onClose(); }
  } catch (e) { if (e.code === 'WINDOW_CLOSED') setHint(e.message + (tpls.length ? ' Choose one above.' : '')); else toast(e.message, true); } finally { setBusy(false); } };
  if (!avail.length) return <Modal title={'Message ' + contact.name} onClose={onClose} footer={<Btn onClick={onClose}>Close</Btn>}><Empty icon="chat" title="No channel available" text={Object.values(chs).some(Boolean) ? 'This contact has no phone number or email for the connected channels.' : 'Connect WhatsApp, email or SMS in Settings → Channels first.'} action={session.can['channels.manage'] && <Btn onClick={() => { onClose(); nav('settings', 'channels'); }}>Channels</Btn>} /></Modal>;
  return <Modal title={(doc ? 'Send ' + doc.label + ' to ' : 'Message ') + contact.name} onClose={onClose} footer={<><Btn onClick={onClose}>Cancel</Btn><Btn kind="primary" busy={busy} disabled={!tpl && !doc && !text.trim()} onClick={send}>Send on {CH_LABEL[ch]}</Btn></>}>
    <div className="seg" style={{ marginBottom: 12 }}>{avail.map((k) => <button key={k} className={ch === k ? 'on' : ''} onClick={() => { setCh(k); setTpl(null); setHint(''); }}>{CH_LABEL[k]}</button>)}</div>
    {doc && ch !== 'sms' && <div className="small" style={{ marginBottom: 8 }}>📄 {doc.label} goes as a PDF{ch === 'email' ? ' attachment' : ' document'}.</div>}
    {doc && ch === 'sms' && <div className="small muted" style={{ marginBottom: 8 }}>SMS can't carry files — the view/pay link is added to your text.</div>}

    {tpl ? <>{tpl.params.map((p, i) => <Field key={i} label={'Field {{' + (i + 1) + '}}'}><input value={p} onChange={(e) => setTpl({ ...tpl, params: tpl.params.map((x, j) => (j === i ? e.target.value : x)) })} /></Field>)}<div className="small muted" style={{ whiteSpace: 'pre-wrap' }}>{tpl.t.body.replace(/\{\{(\d+)\}\}/g, (_, n) => tpl.params[n - 1] || '{{' + n + '}}')}</div></> :
      <Field label={doc ? 'Message (optional)' : 'Message'}><textarea value={text} onChange={(e) => setText(e.target.value)} autoFocus /></Field>}

/* ---------- public: website chat widget and unsubscribe ---------- */
function ChatWidget({ widgetKey }) {
  const [cfg, setCfg] = useState(null); const [err, setErr] = useState(null); const skey = 'bos_chat_' + widgetKey;
  const [session, setSession] = useState(() => store.get(skey) || ''); const [msgs, setMsgs] = useState([]); const [text, setText] = useState(''); const [busy, setBusy] = useState(false); const [form, setForm] = useState({ name: '', phone: '', email: '', message: '' }); const [ferr, setFerr] = useState(null);
  const since = useRef(''); const bottom = useRef(null);
  useEffect(() => { api('public.chatConfig', { key: widgetKey }).then((c) => { setCfg(c); document.documentElement.style.setProperty('--accent', c.color); }).catch(setErr); }, [widgetKey]);
  const poll = useCallback(async () => { if (!session) return; try { const r = await api('public.chatPoll', { key: widgetKey, session, since: since.current }); since.current = r.serverTime; if (r.messages.length) setMsgs((s) => { const ids = {}; s.forEach((m) => { ids[m.id] = 1; }); const fresh = r.messages.filter((m) => !ids[m.id]); const bodies = fresh.filter((m) => m.direction === 'in').map((m) => m.body); return s.filter((m) => !(m.pending && !m.failed && bodies.includes(m.body))).concat(fresh); }); } catch (e) { if (e.code === 'NOT_FOUND') { store.set(skey, null); setSession(''); setMsgs([]); } } }, [session]); // eslint-disable-line
  useEffect(() => { poll(); }, [poll]);
  useVisibleInterval(poll, 6000, [poll]);
  useEffect(() => { if (bottom.current) bottom.current.scrollIntoView({ block: 'end' }); }, [msgs.length]);
  const start = async (e) => { e.preventDefault(); setBusy(true); setFerr(null); try { const r = await api('public.chatStart', { key: widgetKey, ...form, page: PARAMS.page || document.referrer || '' }); store.set(skey, r.session); setSession(r.session); since.current = ''; } catch (x) { setFerr(x); } finally { setBusy(false); } };
  const send = async () => { if (!text.trim()) return; const body = text; setText(''); setMsgs((s) => s.concat([{ id: 'tmp' + Date.now(), direction: 'in', body, at: new Date().toISOString(), pending: true }])); try { await api('public.chatSend', { key: widgetKey, session, message: body }); setTimeout(poll, 400); } catch (e) { setMsgs((s) => s.map((m) => (m.pending && m.body === body ? { ...m, failed: true } : m))); } };
  if (err) return <div className="card-b"><Empty title="Chat is not available" text={err.message} /></div>;
  if (!cfg) return <div style={{ display: 'grid', placeItems: 'center', height: '100vh' }}><span className="spin" /></div>;
  return <div className="chatw">
    <div className="chatw-h"><div className="logo" style={{ background: '#fff', color: 'var(--accent)' }}>{cfg.logoUrl ? <img src={cfg.logoUrl} alt="" style={{ width: 30, height: 30, borderRadius: 8 }} /> : initials(cfg.business)}</div><div><b>{cfg.business}</b><div className="tiny" style={{ opacity: .85 }}>We usually reply within minutes</div></div></div>
    <div className="chatw-body">
      <div className="ibx-bub in">{cfg.greeting}</div>
      {!session ? <form onSubmit={start} className="card card-b" style={{ boxShadow: 'none' }}>
        <Field label="Your name"><input value={form.name} onChange={(e) => setForm({ ...form, name: e.target.value })} required /></Field>
        <Field label="Phone / WhatsApp" error={ferr && ferr.field === 'phone' ? ferr.message : null}><input type="tel" value={form.phone} onChange={(e) => setForm({ ...form, phone: e.target.value })} /></Field>
        <Field label="Email (optional)" error={ferr && ferr.field === 'email' ? ferr.message : null}><input type="email" value={form.email} onChange={(e) => setForm({ ...form, email: e.target.value })} /></Field>
        <Field label="Message"><textarea value={form.message} onChange={(e) => setForm({ ...form, message: e.target.value })} required style={{ minHeight: 60 }} /></Field>
        {ferr && !ferr.field && <div className="err">{ferr.message}</div>}
        <Btn kind="primary" busy={busy} type="submit" style={{ width: '100%' }}>Start chat</Btn>
        <div className="tiny faint" style={{ marginTop: 8 }}>We'll use your number or email only to reply to you.</div></form> :
        msgs.map((m) => <div key={m.id} className={'ibx-bub ' + (m.direction === 'in' ? 'out' : 'in')} style={m.direction === 'in' ? { opacity: m.pending ? .7 : 1 } : null}>{m.sender && <div className="tiny b" style={{ marginBottom: 2 }}>{m.sender}</div>}<div style={{ whiteSpace: 'pre-wrap', wordBreak: 'break-word' }}>{m.body}</div><div className="tiny faint" style={{ textAlign: 'right' }}>{m.failed ? <span className="down">not sent</span> : shortTime(m.at)}</div></div>)}
      <div ref={bottom} />
    </div>
    {session && <div className="chatw-foot"><input value={text} onChange={(e) => setText(e.target.value)} onKeyDown={(e) => e.key === 'Enter' && send()} placeholder="Type a message…" aria-label="Message" /><Btn kind="primary" onClick={send} disabled={!text.trim()}>Send</Btn></div>}
    <div className="tiny faint" style={{ textAlign: 'center', padding: 4 }}>Powered by {BRAND.appName}</div>
  </div>;
}

/* ---------- reports ---------- */
const monthLabel = (k) => { if (/^\d{4}-\d{2}$/.test(k)) return new Date(k + '-01T12:00:00').toLocaleDateString(undefined, { month: 'short', year: '2-digit' }); if (/^\d{4}-\d{2}-\d{2}$/.test(k)) return new Date(k + 'T12:00:00').toLocaleDateString(undefined, { day: 'numeric', month: 'short' }); return k; };
/** Grouped bars (in / out) with an optional line, used by cash flow and P&L. */
function BarsLine({ rows, bars, line, currency, dashedFrom, ariaLabel, wide }) {
  const W = wide ? 1040 : 760, H = 240, P = { l: 56, r: 16, t: 14, b: 28 }, iw = W - P.l - P.r, ih = H - P.t - P.b, n = rows.length || 1;
  const vals = rows.flatMap((r) => bars.map((b) => r[b.key] || 0).concat(line ? [r[line.key] == null ? 0 : r[line.key]] : []));
  const max = Math.max(1, ...vals), min = Math.min(0, ...vals), span = max - min || 1;
  const y = (v) => P.t + ih - ((v - min) / span) * ih, bw = Math.max(3, (iw / n) * 0.7 / bars.length), x0 = (i) => P.l + (iw / n) * i + (iw / n) * 0.15;
  const step = Math.max(1, Math.ceil(n / 9));
  const pts = line ? rows.map((r, i) => (r[line.key] == null ? null : [x0(i) + (bw * bars.length) / 2, y(r[line.key])])) : [];
  const seg = (arr) => arr.filter(Boolean).map((p) => p.join(',')).join(' ');
  return <svg viewBox={`0 0 ${W} ${H}`} style={{ width: '100%', height: 'auto', display: 'block' }} role="img" aria-label={ariaLabel}>
    {[0, 0.5, 1].map((f) => { const v = min + span * f; return <g key={f}><line x1={P.l} x2={W - P.r} y1={y(v)} y2={y(v)} stroke="var(--border2)" /><text className="chart-t" x={P.l - 6} y={y(v) + 4} textAnchor="end">{money(v, currency)}</text></g>; })}
    {min < 0 && <line x1={P.l} x2={W - P.r} y1={y(0)} y2={y(0)} stroke="var(--faint)" />}
    {rows.map((r, i) => <g key={i} opacity={dashedFrom != null && i >= dashedFrom ? 0.45 : 1}>{bars.map((b, j) => { const v = r[b.key] || 0; return <rect key={b.key} x={x0(i) + j * bw} y={Math.min(y(v), y(0))} width={bw - 1} height={Math.max(0, Math.abs(y(v) - y(0)))} rx="2" fill={b.color}><title>{monthLabel(r.label)} · {b.label}: {moneyX(v, currency)}</title></rect>; })}</g>)}
    {line && <polyline fill="none" stroke={line.color} strokeWidth="2.2" points={seg(dashedFrom != null ? pts.slice(0, dashedFrom) : pts)} />}
    {line && dashedFrom != null && <polyline fill="none" stroke={line.color} strokeWidth="2.2" strokeDasharray="5 4" points={seg(pts.slice(Math.max(0, dashedFrom - 1)))} />}
    {rows.map((r, i) => (i % step === 0 ? <text key={i} className="chart-t" x={x0(i) + (bw * bars.length) / 2} y={H - 8} textAnchor="middle">{monthLabel(r.label)}</text> : null))}
  </svg>;
}
const Legend = ({ items }) => <div className="row tiny muted wrap">{items.map((x) => <span key={x.label} className="row" style={{ gap: 4 }}><i style={{ width: x.line ? 14 : 10, height: x.line ? 2 : 10, background: x.color, borderRadius: 2, display: 'inline-block', borderTop: x.dashed ? '2px dashed ' + x.color : undefined }} />{x.label}</span>)}</div>;

    <div className="grid g2">
      <div className="card"><div className="card-h"><h3>By month</h3></div><div className="tscroll"><table className="tbl"><thead><tr><th>Month</th><th style={{ textAlign: 'right' }}>In</th><th style={{ textAlign: 'right' }}>Out</th><th style={{ textAlign: 'right' }}>Net</th><th style={{ textAlign: 'right' }}>Closing</th></tr></thead><tbody>{d.months.slice().reverse().map((m) => <tr key={m.month}><td>{monthLabel(m.month)}</td><td style={{ textAlign: 'right' }}>{money(m.received - m.refunds, cur)}</td><td style={{ textAlign: 'right' }}>{money(m.spent, cur)}</td><td style={{ textAlign: 'right' }} className={m.net < 0 ? 'down' : 'up'}>{money(m.net, cur)}</td><td style={{ textAlign: 'right' }}>{m.closingBalance == null ? '—' : money(m.closingBalance, cur)}</td></tr>)}</tbody></table></div></div>
      <div className="card"><div className="card-h"><h3>Next 3 months</h3><span className="tiny muted">projection</span></div><div className="tscroll"><table className="tbl"><thead><tr><th>Month</th><th style={{ textAlign: 'right' }}>Expected in</th><th style={{ textAlign: 'right' }}>Expected out</th><th style={{ textAlign: 'right' }}>Balance</th></tr></thead><tbody>{d.projection.map((p) => <tr key={p.month}><td>{monthLabel(p.month)}{p.includesOverdue && <div className="tiny down">incl. overdue</div>}</td><td style={{ textAlign: 'right' }}>{money(p.expectedIn, cur)}</td><td style={{ textAlign: 'right' }}>{money(p.expectedOut, cur)}</td><td style={{ textAlign: 'right' }} className="b">{p.projectedBalance == null ? '—' : money(p.projectedBalance, cur)}</td></tr>)}</tbody></table></div><div className="card-b tiny muted">Expected in = invoice balances and instalments falling due (overdue amounts counted this month). Expected out = your average spend over the last 3 full months. Test-gateway payments are excluded.</div></div>

function PayReturn({ reference }) {

function useSlotWeek(fetcher, startDay, deps) {
  const [from, setFrom] = useState(startDay); const [days, setDays] = useState(null); const [err, setErr] = useState(null);
  useEffect(() => { setFrom(startDay); }, [startDay]); // eslint-disable-line
  useEffect(() => { if (!from) return; let on = true; setDays(null); setErr(null); fetcher(from).then((r) => on && setDays(r.days)).catch((e) => on && setErr(e)); return () => { on = false; }; }, [from, ...deps]); // eslint-disable-line
  return { from, setFrom, days, err };
}

function NewTicketModal({ pt, onClose, onDone }) {

function PortalTicket({ pt, id, onBack }) {

      {d && <div style={{ marginTop: 12 }}><textarea value={text} onChange={(e) => setText(e.target.value)} placeholder={d.status === 'closed' ? 'Write to reopen this request' : 'Write a reply'} aria-label="Reply" maxLength={4000} />{err && <div className="err">{err}</div>}<div className="row" style={{ marginTop: 8, justifyContent: 'flex-end' }}><Btn kind="primary" busy={busy} disabled={!text.trim()} onClick={send}>Send</Btn></div></div>}</div></div>;

function PortalProfile({ pt, c, onSaved }) {

function PortalPassword({ pt, has, onSaved }) {

/* =================== orders, jobs & inventory (Phase 6) =================== */
const ORDER_FLOW = ['new', 'confirmed', 'in_progress', 'ready', 'completed'];
const ORDER_LABEL = {
  order: { new: 'New', confirmed: 'Confirmed', in_progress: 'Processing', ready: 'Ready / out for delivery', completed: 'Delivered', cancelled: 'Cancelled' },
  job: { new: 'New', confirmed: 'Scheduled', in_progress: 'In progress', ready: 'Awaiting sign-off', completed: 'Completed', cancelled: 'Cancelled' }
};
const ORDER_TONE = { new: 'blue', confirmed: 'blue', in_progress: 'amber', ready: 'amber', completed: 'green', cancelled: 'red' };
const PRIO_TONE = { low: '', normal: '', high: 'amber', urgent: 'red' };
const olabel = (o, st) => (ORDER_LABEL[(o && o.kind) || 'order'] || ORDER_LABEL.order)[st || o.status] || st;
const NEXT_VERB = { order: { confirmed: 'Confirm', in_progress: 'Start processing', ready: 'Mark ready', completed: 'Mark delivered' }, job: { confirmed: 'Schedule', in_progress: 'Start job', ready: 'Ready for sign-off', completed: 'Complete job' } };
const fmtDue = (o) => !o.dueDate ? '' : dayLabel(o.dueDate, { weekday: 'short', day: 'numeric', month: 'short' }) + (o.dueTime ? ', ' + fmtTime(o.dueTime) : '');
const qtyFmt = (n) => (Math.round((Number(n) || 0) * 1000) / 1000).toLocaleString();

function OrdersPage({ id }) {
  const { session, nav } = useApp(); const can = session.can;
  const canWrite = can['orders.write'] || can['orders.write.own'];
  const [meta] = useLoad(() => api('orders.meta'), []);
  const [f, setF] = useState(() => { let s = {}; try { s = JSON.parse(store.get('bos_orders_f') || '{}'); } catch (e) {} return { kind: s.kind || '', layout: s.layout || 'board', q: '', mine: !can['orders.read'], assigneeId: '', view: 'open' }; });
  useEffect(() => { store.set('bos_orders_f', JSON.stringify({ kind: f.kind, layout: f.layout })); }, [f.kind, f.layout]);
  const [ver, setVer] = useState(0); const [ed, setEd] = useState(null); const [open, setOpen] = useState(id && id !== 'new' ? id : null);
  useEffect(() => { if (id === 'new' && canWrite) { setEd({ kind: 'order' }); try { history.replaceState(null, '', '#/orders'); } catch (e) {} } else if (id === 'newjob' && canWrite) { setEd({ kind: 'job' }); try { history.replaceState(null, '', '#/orders'); } catch (e) {} } else if (id && id !== 'new' && id !== 'newjob') setOpen(id); }, [id]); // eslint-disable-line
  const [st, reload] = useLoad(() => api('orders.list', { kind: f.kind || undefined, view: f.layout === 'board' ? 'all' : f.view, q: f.q || undefined, mine: f.mine || undefined, assigneeId: f.assigneeId || undefined }), [f.kind, f.layout, f.view, f.q, f.mine, f.assigneeId, ver]);
  const d = st.data, c = d ? d.counts : null;
  const changed = () => setVer((x) => x + 1);
  const cutoff = new Date(Date.now() - 14 * 864e5).toISOString();
  const items = d ? d.items.filter((o) => f.layout !== 'board' || (o.status !== 'cancelled' && (o.status !== 'completed' || (o.completedAt || o.updatedAt) > cutoff))) : [];
  return <>
    <div className="ph1"><div><h1>Orders &amp; jobs</h1><p>Orders to deliver and jobs to do — from won deals, invoices or by hand. Stock moves automatically.</p></div>{canWrite && <div className="row"><Btn icon="plus" onClick={() => setEd({ kind: 'job' })}>New job</Btn><Btn kind="primary" icon="plus" onClick={() => setEd({ kind: 'order' })}>New order</Btn></div>}</div>
    {c && <div className="grid g4" style={{ marginBottom: 14 }}><Kpi label="Open" v={c.open} sub={(c.new || 0) + ' new'} onClick={() => setF({ ...f, layout: 'list', view: 'open' })} /><Kpi label="Due today" v={c.today} /><Kpi label="Overdue" v={<span style={{ color: c.overdue ? 'var(--bad)' : undefined }}>{c.overdue}</span>} onClick={() => setF({ ...f, layout: 'list', view: 'overdue' })} /><Kpi label="In progress" v={(c.in_progress || 0) + (c.ready || 0)} sub={(c.ready || 0) + ' ready / awaiting sign-off'} /></div>}
    <div className="row wrap" style={{ marginBottom: 12 }}>
      <div className="seg">{[['', 'All'], ['order', 'Orders'], ['job', 'Jobs']].map(([k, l]) => <button key={k} className={f.kind === k ? 'on' : ''} onClick={() => setF({ ...f, kind: k })}>{l}</button>)}</div>
      <div className="seg">{[['board', 'Board'], ['list', 'List']].map(([k, l]) => <button key={k} className={f.layout === k ? 'on' : ''} onClick={() => setF({ ...f, layout: k })}>{l}</button>)}</div>
      {f.layout === 'list' && <select value={f.view} onChange={(e) => setF({ ...f, view: e.target.value })} style={{ width: 'auto' }} aria-label="Show"><option value="open">Open</option><option value="overdue">Overdue</option><option value="done">Done &amp; cancelled</option><option value="all">Everything</option></select>}
      <input value={f.q} onChange={(e) => setF({ ...f, q: e.target.value })} placeholder="Search number, customer, address" style={{ maxWidth: 260 }} aria-label="Search orders" />
      {can['orders.read'] && meta.data && <select value={f.assigneeId} onChange={(e) => setF({ ...f, assigneeId: e.target.value, mine: false })} style={{ width: 'auto' }} aria-label="Assigned to"><option value="">Anyone</option>{meta.data.team.map((m) => <option key={m.id} value={m.id}>{m.name}</option>)}</select>}
      {can['orders.read'] && <label className="row small" style={{ gap: 6 }}><input type="checkbox" checked={f.mine} onChange={(e) => setF({ ...f, mine: e.target.checked, assigneeId: '' })} />Assigned to me</label>}
    </div>

      f.layout === 'board' ? <OrderBoard items={items} onOpen={(o) => setOpen(o.id)} /> : <OrderList items={items} onOpen={(o) => setOpen(o.id)} />}

    {open && <OrderDrawer id={open} m={meta.data} onClose={() => { setOpen(null); if (id) nav('orders'); }} onChanged={changed} />}
  </>;

function OrderCard({ o, onOpen }) {

    <div className="row between"><span className="tiny muted">{o.number}</span><span className="row" style={{ gap: 4 }}>{o.priority && o.priority !== 'normal' && o.priority !== 'low' && <Badge tone={PRIO_TONE[o.priority]}>{o.priority}</Badge>}<Badge tone={o.kind === 'job' ? 'amber' : ''}>{o.kind}</Badge></span></div>

  </button>;

function OrderBoard({ items, onOpen }) {

function OrderList({ items, onOpen }) {

  return <div className="card"><div className="tscroll"><table className="tbl"><thead><tr><th>Number</th><th>What</th><th>Customer</th><th>Due</th><th className="hide-m">Assigned</th><th>Status</th><th style={{ textAlign: 'right' }} className="hide-m">Value</th></tr></thead><tbody>{items.map((o) => <tr key={o.id} tabIndex={0} style={{ cursor: 'pointer' }} onClick={() => onOpen(o)} onKeyDown={(e) => e.key === 'Enter' && onOpen(o)}><td><div className="b">{o.number}</div><div className="tiny muted">{o.kind}</div></td><td><div className="ellip" style={{ maxWidth: 280 }}>{o.title}</div>{o.checkTotal > 0 && <div className="tiny muted">✓ {o.checkDone}/{o.checkTotal}</div>}</td><td>{o.contactName}</td><td className={o.overdue ? 'down b small' : 'small'}>{fmtDue(o) || '—'}</td><td className="hide-m">{o.assigneeName || <span className="faint">—</span>}</td><td><Badge tone={ORDER_TONE[o.status]}>{o.statusLabel}</Badge></td><td style={{ textAlign: 'right' }} className="hide-m">{o.total ? moneyX(o.total, cur) : '—'}</td></tr>)}</tbody></table></div></div>;

function OrderEditor({ m, init, onClose, onSaved }) {
  const { session, toast } = useApp(); const can = session.can; const cur = session.business.currency;
  const blank = { productId: '', description: '', qty: 1, unitPrice: '', taxable: true };
  const isNew = !init.id;
  const [v, setV] = useState(() => ({ kind: init.kind || 'order', title: init.title || '', contactId: init.contactId || '', contactName: init.contactName || '', dealId: init.dealId || '', assigneeId: init.assigneeId != null ? init.assigneeId : (can['orders.write'] ? '' : session.user.id), dueDate: init.dueDate || '', dueTime: init.dueTime || '', address: init.address || '', priority: init.priority || 'normal', notes: init.notes || '', customerNotes: init.customerNotes || '', items: init.items && init.items.length ? init.items.map((x) => ({ ...blank, ...x })) : init.kind === 'job' ? [] : [{ ...blank }], checklist: (init.checklist || []).map((x) => ({ ...x })), confirm: false }));
  const [busy, setBusy] = useState(false); const [errs, setErrs] = useState({});
  const set = (p) => setV((s) => ({ ...s, ...p }));
  const setItem = (i, p) => setV((s) => ({ ...s, items: s.items.map((x, j) => (j === i ? { ...x, ...p } : x)) }));
  const pick = (i, name) => { const p = m.products.find((x) => x.name === name); if (p) setItem(i, { productId: p.id, description: p.name, unitPrice: p.price, taxable: p.taxable }); else setItem(i, { description: name, productId: '' }); };
  const total = v.items.reduce((a, x) => a + (Number(x.qty) || 0) * (Number(x.unitPrice) || 0), 0);
  const save = async () => {
    setBusy(true); setErrs({});
    const items = v.items.filter((x) => x.description || x.productId).map((x) => ({ productId: x.productId || undefined, description: x.description, qty: Number(x.qty), unitPrice: Number(x.unitPrice) || 0, taxable: !!x.taxable }));
    const data = { id: init.id, kind: isNew ? v.kind : undefined, title: v.title, contactId: isNew ? v.contactId : undefined, dealId: v.dealId || undefined, assigneeId: v.assigneeId, dueDate: v.dueDate, dueTime: v.dueTime, address: v.address, priority: v.priority, notes: v.notes, customerNotes: v.customerNotes, items, checklist: v.checklist.filter((x) => x.text.trim()), status: isNew && v.confirm ? 'confirmed' : undefined };
    try { const r = await api('orders.save', data); toast((r.kind === 'job' ? 'Job ' : 'Order ') + r.number + (isNew ? ' created' : ' saved')); onSaved(r); } catch (e) { if (e.field) setErrs({ [e.field]: e.message }); toast(e.message, true); } finally { setBusy(false); }
  };

function ReceiveModal({ p, onClose, onDone }) {
